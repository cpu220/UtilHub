<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    {{{originalStyles}}}
    {{{userStyles}}}
    <style>
      /* 打印专用样式 */
      @media print {
        body {
          margin: 0;
          padding: 0;
        }
        .no-print {
          display: none !important;
        }
      }
      #page-content {
        padding: 20px;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="page-content">  
      {{{content}}} 
    </div>
  </body>
</html>
